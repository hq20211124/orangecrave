apiVersion: apps/v1
kind: Deployment
metadata:
  name: orangecrave-admin
  namespace: orangecrave
  labels:
    app: orangecrave-admin
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orangecrave-admin
  template:
    metadata:
      labels:
        app: orangecrave-admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orangecrave-admin
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: registry.example.com/orangecrave/admin:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orangecrave-config
            - secretRef:
                name: orangecrave-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /admin-api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin-api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
