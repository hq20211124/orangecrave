<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>黑名单库</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page.css">
</head>
<body>
<div class="page">
  <div class="page-title">黑名单库</div>
  <div class="filter-bar">
    <button class="btn" id="check">查重</button>
    <button class="btn btn-primary" id="search">查询</button>
  </div>
  <div id="table"></div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/dialog.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/table.js"></script>
<script src="../../js/util.js"></script>
<script>
  function load() {
    Table.render({
      el: '#table',
      url: '/admin-api/aud/blacklist/page',
      columns: [
        { field: 'id', title: 'ID' },
        { title: 'pHash', render: r => r.pHash ?? '-' },
        { field: 'source', title: '来源' },
        { field: 'remark', title: '备注' },
        { title: '状态', render: r => r.status === 1 ? '<span class="tag tag-green">启用</span>' : `<span class="tag tag-gray">${r.status ?? '未知'}</span>` },
        { title: '创建时间', render: r => fmtDate(r.createTime) },
        { title: '操作', render: r =>
          `<button class="btn-link" onclick="del(${r.id})" data-perm="audit:blacklist:delete">删除</button>` }
      ],
      query: () => ({})
    });
  }

  async function del(id) {
    if (!await Dialog.confirm('确认删除该黑名单记录？此操作会记入操作日志。', '删除黑名单')) return;
    await http.del('/admin-api/aud/blacklist/' + id);
    Dialog.toast('已删除');
    load();
  }

  async function check() {
    const imageKey = window.prompt('请输入图片 imageKey（用于 pHash 查重）', '');
    if (imageKey === null || imageKey === '') return;
    const res = await http.post('/admin-api/aud/blacklist/check', { imageKey });
    Dialog.toast('命中：' + (res.hit ? '是' : '否') + '，最近距离：' + (res.nearestDistance ?? '-'));
  }

  document.getElementById('check').onclick = check;
  document.getElementById('search').onclick = load;
  load();
</script>
</body>
</html>
