<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>模板库</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page.css">
</head>
<body>
<div class="page">
  <div class="page-title">模板库</div>
  <div class="filter-bar">
    <input id="keyword" placeholder="模板名称">
    <button class="btn btn-primary" id="search">查询</button>
  </div>
  <div id="table"></div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/dialog.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/table.js"></script>
<script src="../../js/util.js"></script>
<script>
  const esc = s => String(s == null ? '' : s).replace(/'/g, "\\'").replace(/"/g, '&quot;');

  function load() {
    Table.render({
      el: '#table',
      url: '/admin-api/pms/template/page',
      columns: [
        { field: 'id', title: 'ID' },
        { field: 'templateName', title: '模板名称' },
        { title: '预览', render: r => { const url = safeUrl(r.previewUrl); return url ? `<a href="${url}" target="_blank">查看</a>` : '-'; } },
        { field: 'designerId', title: '画师 ID' },
        { field: 'categoryId', title: '品类 ID' },
        { title: '源文件', render: r => { const url = safeUrl(r.sourceUrl); return url ? `<a href="${url}" target="_blank">下载</a>` : '-'; } },
        { title: '状态', render: r => r.status === 1 ? '<span class="tag tag-green">启用</span>' : '<span class="tag tag-gray">停用</span>' },
        { title: '操作', render: r =>
          `<button class="btn-link" onclick="del(${r.id}, '${esc(r.templateName)}')">删除</button>` }
      ],
      query: () => ({ keyword: document.getElementById('keyword').value })
    });
  }

  async function del(id, name) {
    if (!await Dialog.confirm(`确认删除模板「${name}」？此操作会记入操作日志。`, '删除模板')) return;
    await http.del('/admin-api/pms/template/' + id);
    Dialog.toast('已删除');
    load();
  }

  document.getElementById('search').onclick = load;
  load();
</script>
</body>
</html>
