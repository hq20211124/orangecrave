<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>客服工单</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page.css">
</head>
<body>
<div class="page">
  <div class="page-title">客服工单</div>
  <div class="filter-bar">
    <select id="type">
      <option value="">全部类型</option>
      <option value="1">售后咨询</option>
      <option value="2">侵权投诉</option>
      <option value="3">色差投诉</option>
      <option value="4">其他</option>
    </select>
    <select id="status">
      <option value="">全部状态</option>
      <option value="1">待受理</option>
      <option value="2">处理中</option>
      <option value="3">已解决</option>
      <option value="4">已关闭</option>
    </select>
    <input id="keyword" placeholder="工单号 / 标题">
    <button class="btn btn-primary" id="search">查询</button>
  </div>
  <div id="table"></div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/dialog.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/table.js"></script>
<script src="../../js/util.js"></script>
<script>
  const TK_TYPE = { 1: '售后咨询', 2: '侵权投诉', 3: '色差投诉', 4: '其他' };
  const TK_STATUS = {
    1: '<span class="tag tag-orange">待受理</span>',
    2: '<span class="tag tag-blue">处理中</span>',
    3: '<span class="tag tag-green">已解决</span>',
    4: '<span class="tag tag-gray">已关闭</span>'
  };
  const TK_SOURCE = { 1: '用户提交', 2: '客服代建' };

  function load() {
    Table.render({
      el: '#table',
      url: '/admin-api/svc/ticket/page',
      columns: [
        { field: 'ticketNo', title: '工单号' },
        { title: '类型', render: r => TK_TYPE[r.type] || '-' },
        { field: 'title', title: '标题' },
        { title: '状态', render: r => TK_STATUS[r.status] || '-' },
        { title: '处理人', render: r => r.handlerId || '-' },
        { title: '来源', render: r => TK_SOURCE[r.source] || '-' },
        { title: '关联订单', render: r => r.orderId || '-' },
        { title: '创建时间', render: r => fmtDate(r.createTime) },
        { title: '操作', render: r =>
          `<a href="ticket-detail.html?id=${r.id}">详情</a> ` +
          `<button class="btn-link" onclick="assign(${r.id})">指派</button> ` +
          `<button class="btn-link" onclick="changeStatus(${r.id})">改状态</button> ` +
          `<button class="btn-link" onclick="closeTicket(${r.id})">关闭</button>` }
      ],
      query: () => ({
        type: document.getElementById('type').value,
        status: document.getElementById('status').value,
        keyword: document.getElementById('keyword').value
      })
    });
  }

  // 指派：PUT /svc/ticket/{id}/handler?handlerId=（RequestParam）
  async function assign(id) {
    const handlerId = window.prompt('请输入处理人（客服）用户ID', '');
    if (handlerId === null || handlerId.trim() === '') return;
    await http.put('/admin-api/svc/ticket/' + id + '/handler' + qs({ handlerId: handlerId.trim() }));
    Dialog.toast('已指派');
    load();
  }

  // 改状态：PUT /svc/ticket/{id}/status?status=（RequestParam）
  async function changeStatus(id) {
    const status = window.prompt('请输入目标状态：1 待受理 / 2 处理中 / 3 已解决 / 4 已关闭', '2');
    if (status === null || status.trim() === '') return;
    if (!['1', '2', '3', '4'].includes(status.trim())) { Dialog.toast('状态取值非法'); return; }
    await http.put('/admin-api/svc/ticket/' + id + '/status' + qs({ status: status.trim() }));
    Dialog.toast('状态已更新');
    load();
  }

  // 关闭：POST /svc/ticket/{id}/close
  async function closeTicket(id) {
    if (!await Dialog.confirm('确认关闭该工单？此操作会记入操作日志。', '关闭工单')) return;
    await http.post('/admin-api/svc/ticket/' + id + '/close');
    Dialog.toast('已关闭');
    load();
  }

  document.getElementById('search').onclick = load;
  load();
</script>
</body>
</html>
