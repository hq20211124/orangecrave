<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商品编辑</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page.css">
  <style>
    .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: var(--space) var(--space); align-items: center; max-width: 720px; }
    .form-grid label { color: var(--color-text-secondary); text-align: right; }
    .form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
    .form-grid .full { grid-column: 1 / 3; }
    .form-actions { margin-top: var(--space); display: flex; gap: var(--space-sm); }
  </style>
</head>
<body>
<div class="page">
  <div class="page-title" id="pageTitle">商品编辑</div>
  <div class="card">
    <div class="form-grid">
      <label>商品名称</label>
      <input id="spuName" maxlength="200" placeholder="必填，200 字以内">

      <label>副标题</label>
      <input id="subTitle" maxlength="255" placeholder="选填，列表页第二行展示">

      <label>系列</label>
      <select id="seriesId"><option value="">请选择</option></select>

      <label>品类</label>
      <select id="categoryId"><option value="">请选择</option></select>

      <label>商品类型</label>
      <select id="goodsType">
        <option value="1">定制</option>
        <option value="2">现货</option>
      </select>

      <label>计价方式</label>
      <select id="pricingType">
        <option value="1">按张</option>
        <option value="2">按面积</option>
        <option value="3">数量阶梯</option>
      </select>

      <label>基础价（元）</label>
      <input id="basePrice" type="number" min="0" step="0.01" placeholder="按张计价时的单价">

      <label>面积单价（元/㎡）</label>
      <input id="areaPrice" type="number" min="0" step="0.01" placeholder="按面积计价时必填">

      <label>阶梯配置</label>
      <input id="pricingConfig" placeholder="数量阶梯 JSON，如 [{&quot;minQty&quot;:10,&quot;price&quot;:3.5}]">

      <label>画师</label>
      <select id="designerId"><option value="">请选择</option></select>

      <label>起订量</label>
      <input id="minOrderQty" type="number" min="1" step="1" placeholder="低于此数不能下单">

      <label>递增量</label>
      <input id="incrementQty" type="number" min="1" step="1" placeholder="数量须为起订量加递增量整数倍">

      <label>运费模板</label>
      <select id="freightTemplateId"><option value="">请选择</option></select>

      <label>需打样</label>
      <select id="needProof">
        <option value="0">否</option>
        <option value="1">是（需打样才能分享）</option>
      </select>

      <label>状态</label>
      <select id="status">
        <option value="1">上架</option>
        <option value="0">下架</option>
      </select>

      <label>封面图</label>
      <input id="cover" maxlength="255" placeholder="图片 URL 或 key">

      <label>图集</label>
      <textarea id="images" rows="2" placeholder="JSON 数组字符串，如 [&quot;url1&quot;,&quot;url2&quot;]"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="save" data-perm="goods:spu:update">保存</button>
      <button class="btn" id="back">返回列表</button>
    </div>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/dialog.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/util.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const spuId = params.get('id') ? Number(params.get('id')) : null;
  const isEdit = spuId != null;

  document.getElementById('pageTitle').textContent = isEdit ? '编辑商品 #' + spuId : '新增商品';
  document.getElementById('back').onclick = () => { location.href = 'list.html'; };

  function fillSelect(id, list, valueField, labelField) {
    const sel = document.getElementById(id);
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item[valueField];
      opt.textContent = item[labelField];
      sel.appendChild(opt);
    });
  }

  async function loadOptions() {
    const [series, categories, designers, freight] = await Promise.all([
      http.get('/admin-api/pms/series/list'),
      http.get('/admin-api/pms/category/list'),
      http.get('/admin-api/pms/designer/list'),
      http.get('/admin-api/pms/freight/page', { pageNum: 1, pageSize: 100 })
    ]);
    fillSelect('seriesId', series || [], 'id', 'seriesName');
    fillSelect('categoryId', categories || [], 'id', 'categoryName');
    fillSelect('designerId', designers || [], 'id', 'designerName');
    fillSelect('freightTemplateId', (freight && freight.list) || [], 'id', 'templateName');
  }

  function fillForm(spu) {
    document.getElementById('spuName').value = spu.spuName ?? '';
    document.getElementById('subTitle').value = spu.subTitle ?? '';
    document.getElementById('seriesId').value = spu.seriesId ?? '';
    document.getElementById('categoryId').value = spu.categoryId ?? '';
    document.getElementById('goodsType').value = spu.goodsType ?? 1;
    document.getElementById('pricingType').value = spu.pricingType ?? 1;
    document.getElementById('basePrice').value = spu.basePrice ?? '';
    document.getElementById('areaPrice').value = spu.areaPrice ?? '';
    document.getElementById('pricingConfig').value = spu.pricingConfig ?? '';
    document.getElementById('designerId').value = spu.designerId ?? '';
    document.getElementById('minOrderQty').value = spu.minOrderQty ?? '';
    document.getElementById('incrementQty').value = spu.incrementQty ?? '';
    document.getElementById('freightTemplateId').value = spu.freightTemplateId ?? '';
    document.getElementById('needProof').value = spu.needProof ?? 0;
    document.getElementById('status').value = spu.status ?? 1;
    document.getElementById('cover').value = spu.cover ?? '';
    document.getElementById('images').value = spu.images ?? '';
  }

  function numOrNull(id) {
    const v = document.getElementById(id).value;
    return v === '' ? null : Number(v);
  }

  async function save() {
    const spuName = document.getElementById('spuName').value.trim();
    if (!spuName) { Dialog.toast('商品名称不能为空'); return; }
    const pricingType = Number(document.getElementById('pricingType').value);
    if (pricingType === 2 && document.getElementById('areaPrice').value === '') {
      Dialog.toast('按面积计价必须填写面积单价');
      return;
    }
    const pricingConfig = document.getElementById('pricingConfig').value.trim();
    if (pricingConfig) {
      try { JSON.parse(pricingConfig); } catch (e) { Dialog.toast('阶梯配置不是合法 JSON'); return; }
    }
    const images = document.getElementById('images').value.trim();
    if (images) {
      try { JSON.parse(images); } catch (e) { Dialog.toast('图集不是合法 JSON 数组'); return; }
    }
    const body = {
      id: spuId,
      spuName,
      subTitle: document.getElementById('subTitle').value.trim() || null,
      seriesId: numOrNull('seriesId'),
      categoryId: numOrNull('categoryId'),
      goodsType: Number(document.getElementById('goodsType').value),
      pricingType,
      basePrice: numOrNull('basePrice'),
      areaPrice: numOrNull('areaPrice'),
      pricingConfig: pricingConfig || null,
      designerId: numOrNull('designerId'),
      minOrderQty: numOrNull('minOrderQty'),
      incrementQty: numOrNull('incrementQty'),
      freightTemplateId: numOrNull('freightTemplateId'),
      needProof: Number(document.getElementById('needProof').value),
      status: Number(document.getElementById('status').value),
      cover: document.getElementById('cover').value.trim() || null,
      images: images || null
    };
    if (isEdit) {
      await http.put('/admin-api/pms/spu', body);
      Dialog.toast('已保存');
    } else {
      await http.post('/admin-api/pms/spu', body);
      Dialog.toast('已创建');
      location.href = 'list.html';
      return;
    }
    load();
  }

  async function load() {
    await loadOptions();
    if (isEdit) {
      const spu = await http.get('/admin-api/pms/spu/' + spuId);
      fillForm(spu);
    }
  }

  document.getElementById('save').onclick = save;
  load();
</script>
</body>
</html>
