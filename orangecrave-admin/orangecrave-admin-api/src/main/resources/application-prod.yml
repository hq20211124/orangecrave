# 生产环境配置模板。所有敏感值从环境变量注入，不在此文件写死。
# 用法：SPRING_PROFILES_ACTIVE=prod + 环境变量（DB_PASSWORD、REDIS_PASSWORD 等）

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

orangecrave:
  redis:
    enabled: true
  storage:
    type: s3
  cache:
    ttl-seconds: 300
    max-size: 10240
  stock:
    ttl-hours: 24
  rate-limit:
    enabled: true
    rules:
      /client-api/oms/order/seckill:
        permits-per-second: 10
        burst: 20
      /client-api/auth/wx-login:
        permits-per-second: 5
        burst: 10
      /admin-api/auth/login:
        permits-per-second: 3
        burst: 5
  mq:
    stream-prefix: "orangecrave:stream:"
    group: orangecrave
    consumer-name:
    batch-size: 16
    block-millis: 1000
    max-length: 10000
    idle-sleep-millis: 500
    initial-delay-millis: 3000
