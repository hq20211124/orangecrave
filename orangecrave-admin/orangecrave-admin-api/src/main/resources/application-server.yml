# 单机生产配置。所有敏感值从环境变量注入。
# 用法：SPRING_PROFILES_ACTIVE=server

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orangecrave}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

# 低内存调优：关 Redis 时用本地缓存
orangecrave:
  redis:
    enabled: ${REDIS_ENABLED:false}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      path: /app/uploads
  cache:
    ttl-seconds: 300
    max-size: 1024
  stock:
    ttl-hours: 24
  rate-limit:
    enabled: true
    rules:
      /client-api/oms/order/seckill:
        permits-per-second: 10
        burst: 20
      /admin-api/auth/login:
        permits-per-second: 3
        burst: 5
  mq:
    stream-prefix: "orangecrave:stream:"
    group: orangecrave
    batch-size: 16
    block-millis: 1000
    max-length: 10000
    idle-sleep-millis: 500
    initial-delay-millis: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# 日志只走 stdout，由容器运行时接管（docker compose logs），避免容器内目录权限问题
logging:
  level:
    root: info
    com.orangecrave: info
